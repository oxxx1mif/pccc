stages:
  - build
  - test

variables:
  CMAKE_BUILD_TYPE: "Release"
  LLVM_VERSION: "23"

build:
  stage: build
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq wget lsb-release software-properties-common gnupg
    - wget -q https://apt.llvm.org/llvm.sh
    - chmod +x llvm.sh
    - ./llvm.sh ${LLVM_VERSION}
    - apt-get install -y -qq cmake ninja-build llvm-${LLVM_VERSION}-dev libmlir-${LLVM_VERSION}-dev llvm-${LLVM_VERSION}-tools mlir-${LLVM_VERSION}-tools python3 python3-pip
    - pip3 install --break-system-packages lit filecheck
  script:
    - mkdir -p build
    - cd build
    - >
      cmake -G Ninja ..
      -DLLVM_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/llvm
      -DMLIR_DIR=/usr/lib/llvm-${LLVM_VERSION}/lib/cmake/mlir
      -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE}
      -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    - ninja pccc-opt
  artifacts:
    paths:
      - build/
    expire_in: 1 day

test:
  stage: test
  needs: ["build"]
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq wget lsb-release software-properties-common gnupg
    - wget -q https://apt.llvm.org/llvm.sh
    - chmod +x llvm.sh
    - ./llvm.sh ${LLVM_VERSION}
    - apt-get install -y -qq llvm-${LLVM_VERSION}-dev libmlir-${LLVM_VERSION}-dev llvm-${LLVM_VERSION}-tools mlir-${LLVM_VERSION}-tools python3 python3-pip
    - pip3 install --break-system-packages lit filecheck
  script:
    - cd build
    - ninja check-pccc
